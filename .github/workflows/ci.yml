name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: forum } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: forum/package-lock.json }
      - run: npm ci
      - run: node test/itest.mjs
      - run: npx playwright install --with-deps chromium
      - run: node test/web_smoke.mjs
