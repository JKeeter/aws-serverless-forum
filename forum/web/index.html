<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Forum</title>
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" id="theme-css" href="themes/neutral-light.css">
</head>
<body>
<div class="site">
  <aside class="sidebar">
    <a href="#/" class="logo-link" id="brand"><img class="logo" id="brandImg" src="" alt=""></a>
    <nav id="mainnav"></nav>
    <div class="side-auth">
      <span class="who" id="who"></span>
      <button id="authBtn"></button>
      <button id="profileBtn" style="display:none">Profile</button>
    </div>
  </aside>
  <main class="main"><div class="wrap" id="app"><p class="muted">Loading…</p></div></main>
</div>
<footer><span id="siteFooter"></span> · <a href="/privacy.html">Privacy</a></footer>

<script src="site.config.js"></script>
<script src="config.js"></script>
<script>
  // theme + layout bootstrap (before app.js renders)
  (function () {
    var c = window.SITE_CONFIG || {};
    var link = document.getElementById("theme-css");
    var theme = c.theme || "neutral-light";
    if (theme !== "neutral-light") {
      // Every colour in the app comes from the theme file's variables, so a
      // misspelled name would otherwise render an unstyled site. Fall back to
      // the default sheet (already linked) if the chosen one 404s.
      link.onerror = function () {
        console.error('SITE_CONFIG.theme "' + theme + '" not found; using neutral-light.');
        link.href = "themes/neutral-light.css";
      };
      link.href = "themes/" + theme + ".css";
    }
    document.body.classList.add("layout-" + (c.layout === "topnav" ? "topnav" : "sidebar"));
    document.title = c.name || "Forum";
  })();
</script>
<script src="app.js"></script>
</body>
</html>
